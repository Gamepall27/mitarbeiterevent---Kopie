<VirtualHost *:80>
    ServerName mitarbeiterevent.dial.de

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mitarbeiterevent.dial.de

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/mitarbeiterevent-error.log
    CustomLog ${APACHE_LOG_DIR}/mitarbeiterevent-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/mitarbeiterevent.dial.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mitarbeiterevent.dial.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
